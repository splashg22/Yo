<!doctype html>
<meta charset="utf-8" />
<body style="margin: 0; background: #000">
  <canvas id="c"></canvas>
  <script>
    // Stand-in renderer: the ring, its coin and the five layers, drawn by a ray-marching
    // shader. Used only by scripts/make-standins.mjs to produce placeholder brand media.
    const canvas = document.getElementById("c");
    const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false, alpha: false });
    const vertex = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
    const fragment = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uShift; uniform float uZoom; uniform vec3 uAccent;

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float tilt;   // how far the ring leans toward the camera
float gap;    // space between layers

float slab(vec3 p, float y){            // one flat ring-shaped layer with slightly rounded edges
  vec2 q = abs(vec2(length(p.xz) - 1.0, p.y - y)) - vec2(0.30, 0.066) + 0.016;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - 0.016;
}
float coin(vec3 p){
  p.xy = rot(0.5) * p.xy;
  vec2 q = abs(vec2(length(p.xz), p.y)) - vec2(0.30, 0.03) + 0.012;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - 0.012;
}
vec2 map(vec3 p){
  p.yz = rot(tilt) * p.yz;
  vec2 best = vec2(1e5, -1.0);
  for (int i = 0; i < 5; i++) {
    float y = (2.0 - float(i)) * (0.14 + gap);   // layer 0 is the top
    float d = slab(p, y);
    if (d < best.x) best = vec2(d, float(i));
  }
  float c = coin(p);
  if (c < best.x) best = vec2(c, 5.0);
  return best;
}
vec3 normalAt(vec3 p){
  vec2 e = vec2(0.0012, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x, map(p + e.yxy).x - map(p - e.yxy).x, map(p + e.yyx).x - map(p - e.yyx).x));
}
vec3 studio(vec3 r){                     // what the surface reflects: a soft box upper left, two accent rims
  vec3 c = vec3(0.0);
  c += vec3(1.9) * smoothstep(0.80, 0.985, dot(r, normalize(vec3(-0.62, 0.68, 0.40))));
  c += uAccent * 2.1 * smoothstep(0.72, 0.96, dot(r, normalize(vec3(0.92, 0.12, -0.36))));
  c += uAccent * vec3(1.0, 0.72, 0.5) * 1.1 * smoothstep(0.84, 0.985, dot(r, normalize(vec3(-0.45, -0.70, 0.30))));
  c += vec3(0.11) * smoothstep(0.30, 0.0, abs(r.y - 0.10));
  c += vec3(0.55) * pow(max(dot(r, normalize(vec3(-0.62, 0.68, 0.40))), 0.0), 2.5);   // wide falloff, so flat faces carry a sheen
  return c;
}
vec3 shade(vec3 ro, vec3 rd){
  // Skip rays that cannot hit: everything fits inside one sphere.
  float b = dot(ro, rd), disc = b * b - dot(ro, ro) + 5.6;
  if (disc < 0.0) return vec3(0.0);
  float t = max(-b - sqrt(disc), 0.0);
  vec2 hit = vec2(1.0, -1.0);
  for (int i = 0; i < 110; i++) {
    hit = map(ro + rd * t);
    if (hit.x < 0.0009 || t > 14.0) break;
    t += hit.x * 0.9;
  }
  if (hit.x > 0.004) return vec3(0.0);
  vec3 p = ro + rd * t, n = normalAt(p), q = p;
  q.yz = rot(tilt) * q.yz;
  float ang = atan(q.z, q.x), rad = length(q.xz), m = hit.y;
  float fres = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
  vec3 key = normalize(vec3(-0.62, 0.68, 0.40));
  float lit = max(dot(n, key), 0.0);
  vec3 col;
  if (m < 0.5) {                          // frosted glass with droplets
    vec2 cell = vec2(ang * 22.0, rad * 26.0), id = floor(cell);
    float drop = smoothstep(0.34, 0.10, length(fract(cell) - 0.5 - (vec2(hash(id), hash(id + 7.0)) - 0.5) * 0.5)) * step(0.55, hash(id + 3.0));
    col = vec3(0.025) + vec3(0.10) * lit + studio(reflect(rd, n)) * (0.50 + 0.9 * drop) + fres * 0.30;
  } else if (m < 1.5) {                   // fine mesh
    float weave = 0.5 + 0.5 * sin(ang * 150.0) * sin(rad * 190.0);
    col = vec3(0.02) + studio(reflect(rd, n)) * (0.18 + 0.75 * smoothstep(0.35, 0.65, weave)) + vec3(0.10) * lit * weave;
  } else if (m < 2.5) {                   // quilted metal
    vec3 bump = vec3(sin(ang * 28.0 + rad * 34.0), 0.0, sin(ang * 28.0 - rad * 34.0)) * 0.16;
    col = studio(reflect(rd, normalize(n + bump))) * 0.95 + vec3(0.03);
  } else if (m < 3.5) {                   // smooth translucent, tinted
    col = uAccent * (0.10 + 0.22 * lit + 0.45 * fres) + studio(reflect(rd, n)) * 0.55;
  } else if (m < 4.5) {                   // dark base plate
    col = vec3(0.012) + studio(reflect(rd, n)) * 0.42 + fres * 0.05;
  } else {                                // the coin
    col = studio(reflect(rd, n)) * vec3(0.95, 0.72, 0.36) * 0.8 + uAccent * 0.16 * lit + vec3(0.02);
  }
  col = 1.0 - exp(-col * 1.25);
  return pow(col, vec3(0.4545));
}
void main(){
  float turn = smoothstep(0.0, 0.52, uT);
  tilt = mix(1.02, 0.30, turn);
  gap = 0.29 * smoothstep(0.50, 0.94, uT);
  vec3 total = vec3(0.0);
  for (int s = 0; s < 4; s++) {           // four samples per pixel
    vec2 o = vec2(mod(float(s), 2.0), floor(float(s) / 2.0)) * 0.5 + 0.25;
    vec2 uv = ((gl_FragCoord.xy + o - 0.5) * 2.0 - uRes) / uRes.y;
    uv.x -= uShift;
    vec3 ro = vec3(0.0, 0.0, 9.0), rd = normalize(vec3(uv / uZoom, -4.2));
    total += shade(ro, rd);
  }
  gl_FragColor = vec4(total / 4.0, 1.0);
}`;
    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    }
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
    gl.linkProgram(program);
    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    // Draws one frame and returns it as a PNG data URL.
    window.render = ({ width, height, t, shift, zoom, accent }) => {
      canvas.width = width;
      canvas.height = height;
      gl.viewport(0, 0, width, height);
      gl.uniform2f(gl.getUniformLocation(program, "uRes"), width, height);
      gl.uniform1f(gl.getUniformLocation(program, "uT"), t);
      gl.uniform1f(gl.getUniformLocation(program, "uShift"), shift);
      gl.uniform1f(gl.getUniformLocation(program, "uZoom"), zoom);
      gl.uniform3f(gl.getUniformLocation(program, "uAccent"), ...accent);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.finish();
      return canvas.toDataURL("image/png");
    };
    window.ready = true;
  </script>
</body>
