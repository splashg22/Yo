<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dacity Strategy mark: the Sunset D">
  <!-- Direction A: Sunset D. A capital D cut into three bands whose heights are 40 / 20 / 40 of the whole,
       one band per destination: pink burn, violet buyback, cyan to holders. -->
  <defs>
    <clipPath id="d"><path d="M12 6h18a26 26 0 0 1 0 52H12z"/></clipPath>
    <linearGradient id="a-top" x1="0" y1="6" x2="0" y2="26.8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd1e8"/><stop offset=".6" stop-color="#ff2d95"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
    <linearGradient id="a-bot" x1="0" y1="37.2" x2="0" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3ee8ff"/><stop offset="1" stop-color="#8ff3ff"/></linearGradient>
  </defs>
  <g clip-path="url(#d)">
    <rect x="0" y="6" width="64" height="20.8" fill="url(#a-top)"/>
    <rect x="0" y="29.4" width="64" height="10.4" fill="#b65cff"/>
    <rect x="0" y="42.4" width="64" height="15.6" fill="url(#a-bot)"/>
  </g>
</svg>
