<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=block" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; } html,body { background:#0c0509; overflow:hidden; } body { padding-top:100px; font-family:"Manrope",sans-serif; color:#f6eff3; -webkit-font-smoothing:antialiased; }
  .stage { width:1200px; height:675px; position:relative; padding:64px 72px; background:#0c0509; overflow:hidden; }
  .glow { position:absolute; left:50%; top:-320px; width:1000px; height:640px; transform:translateX(-50%); background:radial-gradient(closest-side, rgba(255,45,149,.22), transparent); filter:blur(20px); }
  .brand { position:relative; display:flex; align-items:center; gap:14px; font-weight:800; font-size:24px; }
  .brand svg { width:40px; height:40px; filter:drop-shadow(0 0 8px rgba(255,45,149,.45)); }
  h1 { position:relative; margin:88px 0 16px; font-size:72px; font-weight:800; letter-spacing:-.03em; line-height:1.05; }
  p { position:relative; font-size:24px; color:#a9999f; font-weight:500; max-width:820px; }
  .cards { position:absolute; left:72px; right:72px; bottom:64px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .card { background:#140a11; border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:22px 24px; }
  .label { font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#a9999f; }
  .v { font-size:40px; font-weight:800; letter-spacing:-.03em; margin-top:8px; }
  .v.glow-t { text-shadow:0 0 22px rgba(255,45,149,.45); }
  .s { font-size:15px; color:#7a6b73; margin-top:6px; }
</style></head><body>
<div class="stage"><div class="glow"></div>
  <div class="brand"><svg viewBox="0 0 32 32"><rect x="3" y="7" width="8" height="20" rx="4" fill="#ff2d95"/><rect x="14" y="3" width="4" height="18" rx="2" fill="#ffd1e8"/><rect x="21" y="7" width="8" height="20" rx="4" fill="#ff6ab8"/></svg>Dacity Strategy</div>
  <h1>Every fee works for holders.</h1>
  <p>pump.fun trading fees become DCTY burns, buybacks and TTWO payouts. Automatically, on-chain.</p>
  <div class="cards">
    <div class="card"><div class="label">DCTY burn</div><div class="v glow-t">40%</div><div class="s">Bought on the open market and burned</div></div>
    <div class="card"><div class="label">Buyback and burn</div><div class="v">20%</div><div class="s">The coin bought back and burned</div></div>
    <div class="card"><div class="label">Paid to holders</div><div class="v">40%</div><div class="s">In TTWO, straight to wallets</div></div>
  </div>
</div></body></html>
