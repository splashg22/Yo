<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  .stage { width:1200px; height:675px; background:#0b0308 url("../art/card.jpg") center 62% / cover no-repeat; }
  .stage::before { display:none; }
  /* Keep the glass tickets in the lower half bright; calm the top for the headline and the foot for the tape. */
  .stage::after { background:linear-gradient(rgba(11,3,8,.78) 0%, rgba(11,3,8,.55) 30%, rgba(11,3,8,0) 52%, rgba(11,3,8,0) 80%, rgba(11,3,8,.85) 100%); }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .top { position:absolute; left:64px; right:64px; top:44px; display:flex; justify-content:space-between; align-items:center; padding-bottom:16px; border-bottom:1px solid rgba(255,228,243,.18); }
  .brand { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .brand svg { width:30px; height:30px; }
  .brand small { font-family:"IBM Plex Mono", monospace; font-weight:500; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-left:6px; }
  .stamp { display:inline-block; padding:3px 9px 2px; border:1.5px solid #fff4fa; border-radius:2px; color:#fff4fa; font-weight:600; font-size:11px; letter-spacing:.16em; text-transform:uppercase; transform:rotate(-1.5deg); }
  h1 { position:absolute; left:64px; top:112px; font-size:66px; line-height:1.02; letter-spacing:-.045em; font-weight:300; max-width:900px; }
  h1 b { font-weight:800; }
  .foot { position:absolute; left:64px; right:64px; bottom:40px; display:flex; border-top:1px solid rgba(255,228,243,.28); border-bottom:1px solid rgba(255,228,243,.28); font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,228,243,.62); }
  .foot span { flex:1; padding:12px 16px; border-right:1px solid rgba(255,228,243,.16); display:flex; align-items:baseline; gap:10px; }
  .foot span:last-child { border-right:0; }
  .foot em { font-style:normal; font-weight:600; font-size:22px; letter-spacing:-.02em; color:#fff4fa; }
  .foot em.pink { color:var(--accent); } .foot em.blue { color:var(--blue); }
</style></head><body>
<div class="stage">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 32 32"><path d="M3 9a2 2 0 0 1 2-2h22a2 2 0 0 1 2 2v3.2a3.8 3.8 0 0 0 0 7.6V23a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3.2a3.8 3.8 0 0 0 0-7.6z" fill="#ff1f8f"/><path d="M11.5 9.5v13" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-dasharray="2.2 2.2"/></svg>Dacity Strategy<small>Statement</small></div>
    <span class="stamp mono">On-chain · every step a public transaction</span>
  </div>
  <h1>Fees burn <span class="pink">DCTY</span>, buy back the coin <b>and pay you in <span class="blue">TTWO</span>.</b></h1>
  <div class="foot mono">
    <span><em class="pink">40%</em>buys and burns DCTY</span>
    <span><em>20%</em>buys this coin back, burns it</span>
    <span><em class="blue">40%</em>paid to holders in TTWO</span>
  </div>
</div>
</body></html>
