<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  .stage { width:1500px; height:500px; background:#0b0308 url("../art/header.jpg") center 45% / cover no-repeat; }
  .stage::before { display:none; }
  /* Legibility: darken the left where the type sits, keep the lit tiles on the right. */
  .stage::after { background:linear-gradient(90deg, rgba(11,3,8,.88) 0%, rgba(11,3,8,.72) 34%, rgba(11,3,8,.15) 60%, rgba(11,3,8,0) 100%), linear-gradient(rgba(11,3,8,.25), rgba(11,3,8,.1) 40%, rgba(11,3,8,.45)); }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .rule { position:absolute; left:84px; right:84px; top:92px; height:1px; background:rgba(255,228,243,.18); }
  .tape { position:absolute; left:84px; top:104px; display:flex; gap:0; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,228,243,.6); }
  .tape span { padding:0 14px 0 0; margin-right:14px; border-right:1px solid rgba(255,228,243,.18); }
  .tape span:last-child { border:0; }
  .tape b { color:#fff4fa; font-weight:600; }
  .stamp { display:inline-block; padding:2px 8px 1px; border:1.5px solid #4ade80; border-radius:2px; color:#4ade80; font-weight:600; font-size:11px; letter-spacing:.16em; transform:rotate(-1.5deg); margin-right:12px; }
  .left { position:absolute; left:84px; top:150px; width:780px; }
  .word { font-size:88px; line-height:.98; letter-spacing:-.045em; font-weight:300; }
  .word b { font-weight:800; }
  .tag { margin-top:20px; font-size:28px; line-height:1.22; letter-spacing:-.02em; color:var(--muted); font-weight:400; max-width:700px; }
  .tag b { color:var(--ink); font-weight:700; }
  .meta { position:absolute; left:84px; top:392px; display:flex; gap:22px; align-items:center; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,228,243,.55); }
  .meta b { color:#fff4fa; font-weight:600; }
  .meta i { display:inline-block; width:34px; height:1px; background:rgba(255,228,243,.3); vertical-align:middle; }
</style></head><body>
<div class="stage">
  <div class="rule"></div>
  <div class="tape mono"><span><span class="stamp">Live</span>Statement of account</span><span>Chain <b>Solana</b></span><span>Pair <b>TTWO</b></span><span>Split <b>40 · 20 · 40</b></span></div>
  <div class="left">
    <div class="word">Dacity <b>Strategy</b></div>
    <div class="tag">Every creator fee <b>burns <span class="pink">DCTY</span></b>, <b>buys the coin back</b> and <b>pays holders in <span class="blue">TTWO</span></b>. Proven live on Solana.</div>
  </div>
  <div class="meta mono"><span>Nothing is kept</span><i></i><span>Nothing to claim</span><i></i><span>Every step on-chain</span></div>
</div>
</body></html>
